[project]
name = "rocket-bot-poc"
version = "0.1.0"
description = "Minimal Python PoC for a Rocket.Chat bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "httpx>=0.28.0",
    "PyYAML>=6.0.1",
    "websockets>=12.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
