# Example configuration for local setup.
# 1) Copy values into config/bot_config.yaml
# 2) Export token env var before starting the bot:
#    export ROCKETCHAT_BOT_AUTH_TOKEN="<your-token>"

rocketchat:
  base_url: "https://chat.example.com"
  user_id: "BOT_USER_ID_FROM_ROCKETCHAT"
  auth_token_env: "ROCKETCHAT_BOT_AUTH_TOKEN"
  ignore_own_messages: true
  websocket_url: "wss://chat.example.com/websocket"
  room_filters:
    - "GENERAL_ROOM_ID"

commands:
  hc_version: "!hc version"
  hc_help: "!help"
  book: "!book"
  book_status: "!book status"
  unbook: "!unbook"
  unbook_all: "!unbook all"

help:
  template: |
    Available commands:
    {{commands}}

    Available aliases:
    {{aliases}}

messages:
  booking_success: "{{env_name}} is booked by {{username}} for another {{remaining_time}}."
  booking_busy: "{{env_name}} занят пользователем {{username}}. Осталось: {{remaining_time}}"
  booking_free: "{{env_name}} is free."
  unbooking_success: "{{env_name}} unbooked by {{username}}."
  unbooking_all_success: "All environments are successfully unbooked."
  incorrect_alias: "Incorrect alias: {{env_name}}."
  incorrect_or_missing_time: "Incorrect or missing time."

environments:
  production:
    name: "Production"
    url: "https://prod.example.com/_hc"
  staging:
    name: "Staging"
    url: "https://staging.example.com/_hc"

database:
  sqlite_path: "data/bot.db"

logging:
  level: "INFO"
